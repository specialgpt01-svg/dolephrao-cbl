<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 งานตรวจและอนุมัติผลงานผู้เรียน — Phrao Learning District</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --font-main: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      display: block !important;
      width: 100% !important;
      min-height: 100vh;
      margin: 0 !important;
      padding: 0 !important;
      font-family: var(--font-main);
      background-color: #0b132b !important;
      color: #f8fafc !important;
      overflow-x: hidden;
    }
    .custom-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .custom-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-pop {
      animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="custom-scrollbar">

  <!-- ═══════════════════ Main Container ═══════════════════ -->
  <div class="w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

    <!-- Header Navigation -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 sm:p-5 mb-6 rounded-2xl bg-slate-800/60 border border-slate-700/60 backdrop-blur-md shadow-lg">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white text-xl shadow-md shadow-teal-500/20 shrink-0">
          <i class="fas fa-clipboard-check"></i>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-base sm:text-lg font-black text-white m-0 flex items-center gap-2">
              งานตรวจและอนุมัติผลงานผู้เรียน (Approvals & Evaluations)
            </h1>
            <span class="px-2.5 py-0.5 text-[10px] font-extrabold uppercase tracking-wider rounded-full bg-teal-500/20 text-teal-400 border border-teal-500/30">
              Evaluation Hub
            </span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5 m-0">
            ตรวจบันทึกกิจกรรม, สรุปผลการเรียนอัพสกิล, ข้อเสนอแนะผู้เรียน และอนุมัติชั่วโมง กพช.
          </p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap shrink-0">
        <button type="button" onclick="loadApprovalData(true)" class="flex items-center gap-1 px-3 py-2 text-xs font-bold rounded-full bg-slate-700/70 hover:bg-slate-700 text-slate-200 border border-slate-600 transition-all active:scale-95" title="รีเฟรชข้อมูล">
          <i class="fas fa-sync-alt" id="refresh-icon"></i>
        </button>
        <button type="button" onclick="goBackToHub()" class="flex items-center gap-1.5 px-4 py-2 text-xs font-bold rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 shadow-sm transition-all active:scale-95">
          <i class="fas fa-arrow-left"></i> ศูนย์จัดการ
        </button>
      </div>
    </header>

    <!-- Filters & Workspace Navigation -->
    <section class="p-4 sm:p-5 rounded-2xl bg-slate-800/60 border border-slate-700/60 mb-6 shadow-md space-y-4">
      
      <!-- Top: Main Tabs -->
      <div class="flex items-center gap-2 border-b border-slate-700/60 pb-3 flex-wrap">
        <button type="button" onclick="switchApprovalTab('logs')" id="tab-btn-logs" class="px-4 py-2 text-xs font-bold rounded-xl bg-teal-600 text-white shadow-md shadow-teal-600/30 transition flex items-center gap-1.5">
          <i class="fas fa-file-signature"></i> ตรวจบันทึกกิจกรรม (<span id="tab-count-logs">0</span>)
        </button>
        <button type="button" onclick="switchApprovalTab('videologs')" id="tab-btn-videologs" class="px-4 py-2 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5">
          <i class="fas fa-video text-rose-400"></i> ตรวจบันทึกอัพสกิล (<span id="tab-count-videologs">0</span>)
        </button>
        <button type="button" onclick="switchApprovalTab('proposals')" id="tab-btn-proposals" class="px-4 py-2 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5">
          <i class="fas fa-lightbulb text-amber-400"></i> ข้อเสนอแนะผู้เรียน (<span id="tab-count-proposals">0</span>)
        </button>
        <button type="button" onclick="switchApprovalTab('nfe')" id="tab-btn-nfe" class="px-4 py-2 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5">
          <i class="fas fa-hourglass-half text-sky-400"></i> อนุมัติชั่วโมง กพช.
        </button>
      </div>

      <!-- Bottom: Search & Selectors -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        
        <!-- Institution Selector -->
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1"><i class="fas fa-university mr-1 text-blue-400"></i>สถานศึกษาหลัก</label>
          <select id="filter-institution" onchange="onInstitutionChange()" class="w-full px-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-teal-500 font-medium">
            <option value="ALL">🌍 ทุกสถานศึกษา (ทั้งหมด)</option>
          </select>
        </div>

        <!-- Tambon Selector -->
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1"><i class="fas fa-map-pin mr-1 text-teal-400"></i>สังกัดตำบล / ศศช.</label>
          <select id="filter-tambon" onchange="loadApprovalData(true)" class="w-full px-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-teal-500 font-medium">
            <option value="ทั้งหมด">🌍 ทุกตำบลในสังกัด (ทั้งหมด)</option>
          </select>
        </div>

        <!-- Search Bar -->
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1"><i class="fas fa-search mr-1 text-sky-400"></i>ค้นหาชื่อ หรือ กิจกรรม</label>
          <div class="relative">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="filter-search" onkeyup="renderApprovalList()" placeholder="พิมพ์ชื่อผู้เรียน หรือ ชื่อกิจกรรม..." class="w-full pl-9 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-teal-500">
          </div>
        </div>

      </div>

    </section>

    <!-- ═══════════════════ Dynamic Items Container ═══════════════════ -->
    <main id="approval-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-16 text-slate-400">
        <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-teal-500"></i>
        <p class="text-sm font-semibold">กำลังโหลดรายการตรวจประเมิน...</p>
      </div>
    </main>

  </div> <!-- End Container -->

  <!-- ═══════════════════ Modal: Review Activity Log ═══════════════════ -->
  <div id="modal-review-log" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop" style="display: none;">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 shadow-2xl animate-pop">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-base">
            <i class="fas fa-pen-nib"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white m-0">ประเมินผลงานกิจกรรม</h3>
            <p class="text-[11px] text-slate-400 m-0" id="modal-log-user">ผู้เรียน: -</p>
          </div>
        </div>
        <button type="button" onclick="closeReviewModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>

      <form id="review-log-form" onsubmit="submitReviewAction(event)" class="space-y-3 text-xs">
        <input type="hidden" id="modal-log-id">
        <input type="hidden" id="modal-log-phone">

        <div class="p-3 rounded-xl bg-slate-800/60 border border-slate-700/60 space-y-1.5">
          <div class="text-[11px] text-teal-400 font-bold" id="modal-log-activity">กิจกรรม: -</div>
          <div class="text-xs text-slate-300 leading-relaxed max-h-32 overflow-y-auto" id="modal-log-desc">-</div>
          <div id="modal-log-link-container" style="display: none;" class="pt-1">
            <a id="modal-log-link" href="#" target="_blank" class="text-sky-400 hover:underline inline-flex items-center gap-1 font-bold">
              <i class="fas fa-external-link-alt"></i> เปิดดูไฟล์แนบ / ลิงก์ผลงาน
            </a>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-300 mb-1">ผลการประเมิน <span class="text-rose-400">*</span></label>
            <select id="modal-log-status" required class="w-full px-3 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-teal-500">
              <option value="approved" selected>✅ ผ่าน (อนุมัติ)</option>
              <option value="rejected">❌ ไม่ผ่าน (ให้แก้ไขใหม่)</option>
            </select>
          </div>
          <div>
            <label id="modal-score-label" class="block font-bold text-slate-300 mb-1">คะแนนที่มอบให้ (แต้ม)</label>
            <input type="number" id="modal-log-points" min="0" max="100" value="10" placeholder="10" class="w-full px-3 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-teal-500 font-mono">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">ความคิดเห็น / ข้อเสนอแนะจากครูผู้สอน</label>
          <textarea id="modal-log-feedback" rows="2.5" placeholder="ระบุคำชมเชยหรือคำแนะนำเพิ่มเติม..." class="w-full px-3.5 py-2 bg-slate-800/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800 mt-4">
          <button type="button" onclick="closeReviewModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold transition">
            ยกเลิก
          </button>
          <button type="submit" id="modal-review-btn" class="px-5 py-2 rounded-xl bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold shadow-md shadow-teal-600/30 transition">
            💾 บันทึกผลการตรวจ
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════════ Custom Toast Container ═══════════════════ -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <!-- Core Scripts -->
  <script src="js/core/api.js?v=20260820-standalone-approvals-v1"></script>
  <script src="js/core/auth.js?v=20260820-standalone-approvals-v1"></script>

  <script>
    let allInstitutions = [];
    let currentItems = [];
    let activeTab = 'logs'; // 'logs' | 'videologs' | 'proposals' | 'nfe'

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      const bgMap = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-600 text-white border-amber-500',
        info: 'bg-teal-600 text-white border-teal-500'
      };
      const iconMap = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
      };

      toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold pointer-events-auto transition-all transform duration-300 translate-y-2 opacity-0 ${bgMap[type] || bgMap.info}`;
      toast.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> <span>${escapeHtml(message)}</span>`;

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function escapeJS(str) {
      if (!str && str !== 0) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function goBackToHub() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    // ─── Initialization ──────────────────────────────────────────
    function initData() {
      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = urlParams.get('tab');
      if (['logs', 'videologs', 'proposals', 'nfe'].includes(tabParam)) {
        activeTab = tabParam;
      }

      loadInstitutions();
    }

    function loadInstitutions() {
      apiGet('getInstitutions', withAuthParams({}))
        .then(res => {
          if (res && res.status === 'success' && Array.isArray(res.institutions)) {
            allInstitutions = res.institutions;
            
            let filterHtml = '<option value="ALL">🌍 ทุกสถานศึกษา (ทั้งหมด)</option>';
            res.institutions.forEach(inst => {
              filterHtml += `<option value="${escapeHtml(inst.id)}">🏫 ${escapeHtml(inst.name)}</option>`;
            });
            document.getElementById('filter-institution').innerHTML = filterHtml;

            const userInst = localStorage.getItem('userInstitution') || 'INS_PHRAO';
            document.getElementById('filter-institution').value = userInst;
            onInstitutionChange();
          } else {
            loadApprovalData(true);
          }
        })
        .catch(err => {
          console.error('Load institutions error:', err);
          loadApprovalData(true);
        });
    }

    function onInstitutionChange() {
      const instId = document.getElementById('filter-institution').value;
      const tambonSelect = document.getElementById('filter-tambon');

      let subUnits = [];
      if (instId === 'ALL') {
        allInstitutions.forEach(inst => {
          if (Array.isArray(inst.sub_units)) subUnits.push(...inst.sub_units);
        });
        subUnits = [...new Set(subUnits)];
      } else {
        const found = allInstitutions.find(i => i.id === instId);
        if (found && Array.isArray(found.sub_units)) {
          subUnits = found.sub_units;
        }
      }

      let filterHtml = '<option value="ทั้งหมด">🌍 ทุกตำบลในสังกัด (ทั้งหมด)</option>';
      subUnits.forEach(u => {
        filterHtml += `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`;
      });

      tambonSelect.innerHTML = filterHtml;
      loadApprovalData(true);
    }

    function switchApprovalTab(tab) {
      activeTab = tab;
      const tabs = ['logs', 'videologs', 'proposals', 'nfe'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (btn) {
          btn.className = (t === tab)
            ? 'px-4 py-2 text-xs font-bold rounded-xl bg-teal-600 text-white shadow-md shadow-teal-600/30 transition flex items-center gap-1.5'
            : 'px-4 py-2 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1.5';
        }
      });

      loadApprovalData(true);
    }

    // ─── Load Data ───────────────────────────────────────────────
    function loadApprovalData(forceRefresh = false) {
      const tambon = document.getElementById('filter-tambon').value;
      const instId = document.getElementById('filter-institution').value;
      const container = document.getElementById('approval-container');
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('fa-spin');

      container.innerHTML = `
        <div class="col-span-full text-center py-16 text-slate-400">
          <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-teal-500"></i>
          <p class="text-sm font-semibold">กำลังโหลดรายการ...</p>
        </div>
      `;

      let actionName = 'getPendingLogs';
      let payload = { tambon: tambon, institutionId: instId };

      if (activeTab === 'videologs') {
        actionName = 'getLearningLogs';
        payload.status = 'pending';
      } else if (activeTab === 'proposals') {
        actionName = 'getPendingProposals';
      } else if (activeTab === 'nfe') {
        actionName = 'getNfeReports';
      }

      apiGet(actionName, withAuthParams(payload))
        .then(res => {
          if (icon) icon.classList.remove('fa-spin');
          let items = [];
          if (Array.isArray(res)) items = res;
          else if (res && Array.isArray(res.data)) items = res.data;
          else if (res && Array.isArray(res.items)) items = res.items;

          currentItems = items;
          updateTabCounts();
          renderApprovalList();
        })
        .catch(err => {
          if (icon) icon.classList.remove('fa-spin');
          console.error('Load approval error:', err);
          container.innerHTML = `
            <div class="col-span-full text-center py-16 text-rose-400 bg-rose-950/20 rounded-3xl border border-rose-900/50">
              <i class="fas fa-triangle-exclamation text-3xl mb-3 text-rose-500"></i>
              <h4 class="text-sm font-bold text-rose-300">เกิดข้อผิดพลาดในการโหลดรายการ</h4>
            </div>
          `;
        });
    }

    function updateTabCounts() {
      const countEl = document.getElementById(`tab-count-${activeTab}`);
      if (countEl) countEl.innerText = currentItems.length;
    }

    // ─── Render List ─────────────────────────────────────────────
    function renderApprovalList() {
      const container = document.getElementById('approval-container');
      const search = (document.getElementById('filter-search').value || '').trim().toLowerCase();

      let filtered = currentItems;
      if (search) {
        filtered = filtered.filter(item => {
          const name = (item.fullName || item.userName || '').toLowerCase();
          const title = (item.activityName || item.title || item.videoTitle || '').toLowerCase();
          const tambon = (item.tambon || '').toLowerCase();
          return name.includes(search) || title.includes(search) || tambon.includes(search);
        });
      }

      if (!filtered.length) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-400 bg-slate-800/30 rounded-3xl border border-slate-700/50">
            <i class="fas fa-circle-check text-4xl mb-3 text-teal-400"></i>
            <h4 class="text-base font-bold text-slate-200">ไม่มีรายการค้างตรวจในหมวดนี้</h4>
            <p class="text-xs text-slate-400 mt-1">ทุกผลงานได้รับการประเมินและอนุมัติเรียบร้อยแล้ว</p>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach((item, idx) => {
        const user = item.fullName || item.userName || 'ไม่ระบุชื่อ';
        const phone = item.phone || item.userPhone || '-';
        const tambon = item.tambon || 'ไม่ระบุ';
        const date = item.date || item.timestamp || item.created_at || '-';
        const title = item.activityName || item.title || item.videoTitle || 'กิจกรรมการเรียนรู้';
        const desc = item.description || item.summary || item.notes || '-';
        const link = item.externalLink || item.link || '';
        const id = item.logId || item.id || item.rowIdx || idx;

        html += `
          <div class="custom-card p-4 sm:p-5 flex flex-col justify-between">
            <div>
              <!-- User Info Header -->
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-sm font-bold shrink-0">
                    <i class="fas fa-user"></i>
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-white m-0 truncate" title="${escapeHtml(user)}">${escapeHtml(user)}</h3>
                    <p class="text-[11px] text-slate-400 font-mono m-0">${escapeHtml(phone)} · ตำบล${escapeHtml(tambon)}</p>
                  </div>
                </div>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 shrink-0">
                  รอตรวจ
                </span>
              </div>

              <!-- Activity Title & Description -->
              <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-700/60 mb-3 space-y-1">
                <div class="text-xs font-bold text-teal-300 flex items-center gap-1.5 truncate">
                  <i class="fas fa-bookmark text-[10px]"></i> ${escapeHtml(title)}
                </div>
                <p class="text-xs text-slate-300 line-clamp-3 leading-relaxed m-0">${escapeHtml(desc)}</p>
              </div>

              ${link ? `
                <div class="mb-3">
                  <a href="${escapeHtml(link)}" target="_blank" class="text-[11px] text-sky-400 hover:underline flex items-center gap-1 truncate font-bold">
                    <i class="fas fa-link"></i> ${escapeHtml(link)}
                  </a>
                </div>
              ` : ''}

              <div class="text-[10px] text-slate-500 font-mono">
                <i class="fas fa-clock mr-1"></i>ส่งเมื่อ: ${escapeHtml(date)}
              </div>
            </div>

            <!-- Action Button -->
            <div class="pt-3 border-t border-slate-700/50 mt-3">
              <button type="button" onclick="openReviewModal('${escapeJS(id)}', '${escapeJS(phone)}', '${escapeJS(user)}', '${escapeJS(title)}', '${escapeJS(desc)}', '${escapeJS(link)}')" class="w-full py-2 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-md shadow-teal-600/20">
                <i class="fas fa-pen-nib"></i> ประเมินผลงาน
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ─── Modal Review Actions ────────────────────────────────────
    function openReviewModal(id, phone, user, title, desc, link) {
      document.getElementById('modal-log-id').value = id;
      document.getElementById('modal-log-phone').value = phone;
      document.getElementById('modal-log-user').innerText = `ผู้เรียน: ${user} (${phone})`;
      document.getElementById('modal-log-activity').innerText = `กิจกรรม: ${title}`;
      document.getElementById('modal-log-desc').innerText = desc || '-';

      const linkContainer = document.getElementById('modal-log-link-container');
      const linkEl = document.getElementById('modal-log-link');
      if (link && link.startsWith('http')) {
        linkEl.href = link;
        linkContainer.style.display = 'block';
      } else {
        linkContainer.style.display = 'none';
      }

      document.getElementById('modal-log-feedback').value = '';

      // Adjust score input based on active tab
      const scoreInput = document.getElementById('modal-log-points');
      const scoreLabel = document.getElementById('modal-score-label');
      if (activeTab === 'videologs') {
        scoreInput.max = 10;
        scoreInput.value = 10;
        scoreInput.placeholder = '0-10';
        if (scoreLabel) scoreLabel.innerHTML = 'คะแนนประเมินบันทึก <span class="text-amber-400 font-mono">(0 - 10 แต้ม)</span>';
      } else {
        scoreInput.max = 100;
        scoreInput.value = 10;
        scoreInput.placeholder = '10';
        if (scoreLabel) scoreLabel.innerHTML = 'คะแนนที่มอบให้ (แต้ม)';
      }

      document.getElementById('modal-review-log').style.display = 'flex';
    }

    function closeReviewModal() {
      document.getElementById('modal-review-log').style.display = 'none';
    }

    function submitReviewAction(e) {
      e.preventDefault();
      const id = document.getElementById('modal-log-id').value;
      const phone = document.getElementById('modal-log-phone').value;
      const status = document.getElementById('modal-log-status').value;
      const points = parseInt(document.getElementById('modal-log-points').value) || 0;
      const feedback = document.getElementById('modal-log-feedback').value.trim();

      const btn = document.getElementById('modal-review-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> กำลังบันทึก...';

      let actionName = 'reviewLog';
      let payload = {
        logId: id,
        phone: phone,
        status: status,
        score: points,
        points: points,
        note: feedback,
        feedback: feedback
      };

      if (activeTab === 'videologs') {
        actionName = 'gradeLearningLog';
        payload = {
          logId: id,
          status: status,
          score: points,
          grade: points,
          feedback: feedback
        };
      } else if (activeTab === 'proposals') {
        actionName = 'reviewProposal';
        payload = { proposalId: id, status: status, response: feedback };
      }

      apiPost(actionName, withAuthParams(payload))
        .then(res => {
          btn.disabled = false;
          btn.innerHTML = '💾 บันทึกผลการตรวจ';
          if (res && res.status === 'success') {
            showToast('บันทึกผลการประเมินเรียบร้อยแล้ว', 'success');
            closeReviewModal();
            loadApprovalData(true);
          } else {
            showToast(res.message || 'บันทึกไม่สำเร็จ', 'error');
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerHTML = '💾 บันทึกผลการตรวจ';
          console.error('Review error:', err);
          showToast('เกิดข้อผิดพลาดในการบันทึกการประเมิน', 'error');
        });
    }

    // ─── On Load ────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      initData();
    });
  </script>
